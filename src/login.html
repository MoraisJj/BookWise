<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookWise - Autenticação</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>BookWise</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início / Acervo</a></li>
                <li><a href="login.html">Entrar</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Acessar Conta</h2>
            <form action="#" method="POST">
                <div>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="seu@email.com">
                </div>

                <div>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required>
                </div>

                <div style="text-align: right; margin-top: -0.5rem; margin-bottom: 0.5rem;">
                    <a href="#" style="font-size: 0.85rem; color: #666; text-decoration: none;">Esqueci minha senha</a>
                </div>

                <button type="submit">Entrar</button>
            </form>
        </section>

        <section>
            <h2>Criar Nova Conta</h2>
            <form action="#" method="POST">
                <div>
                    <label for="novo-nome">Nome Completo:</label>
                    <input type="text" id="novo-nome" name="nome" required>
                </div>

                <div>
                    <label for="novo-email">E-mail:</label>
                    <input type="email" id="novo-email" name="email" required>
                </div>

                <div>
                    <label for="nova-senha">Senha:</label>
                    <input type="password" id="nova-senha" name="senha" required>
                </div>

                <button type="submit">Cadastrar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 BookWise - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
