<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookWise - Cadastrar Livro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>BookWise</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início / Acervo</a></li>
                <li><a href="cadastrar-livro.html">Cadastrar Livro</a></li>
                <li><a href="login.html">Entrar / Cadastrar</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Cadastrar Novo Livro</h2>
            
            <form id="form-cadastro" action="#" method="POST">
                <!-- Div onde o JavaScript vai injetar a mensagem de sucesso ou erro -->
                <div id="mensagem-feedback" style="display: none; padding: 10px; margin-bottom: 15px; border-radius: 5px; font-weight: bold;"></div>

                <div>
                    <label for="titulo">Título do Livro:</label>
                    <input type="text" id="titulo" name="titulo" required>
                </div>

                <div>
                    <label for="autor">Autor:</label>
                    <input type="text" id="autor" name="autor" required>
                </div>

                <div>
                    <label for="categoria">Categoria / Gênero:</label>
                    <select id="categoria" name="categoria" required>
                        <option value="">Selecione um gênero...</option>
                        <option value="Ficção Científica">Ficção Científica</option>
                        <option value="Literatura Brasileira">Literatura Brasileira</option>
                        <option value="Fantasia">Fantasia</option>
                        <option value="Técnico / Acadêmico">Técnico / Acadêmico</option>
                        <option value="Romance">Romance</option>
                        <option value="Biografia">Biografia</option>
                    </select>
                </div>

                <div>
                    <label for="status">Status de Leitura:</label>
                    <select id="status" name="status" required>
                        <option value="quero-ler">Quero Ler</option>
                        <option value="lendo">Lendo</option>
                        <option value="lido">Lido</option>
                    </select>
                </div>

                <div>
                    <label for="opiniao">Opinião / Resenha:</label>
                    <textarea id="opiniao" name="opiniao" rows="4" placeholder="O que você achou do livro? (Opcional)"></textarea>
                </div>

                <button type="submit">Salvar Livro</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 BookWise - Sistema de Gerenciamento de Acervo Pessoal</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
