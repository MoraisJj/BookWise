<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookWise - Cadastrar Livro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>BookWise</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início / Acervo</a></li>
                <li><a href="cadastrar-livro.html">Cadastrar Livro</a></li>
                <li><a href="login.html">Entrar / Cadastrar</a></li>
            </ul>
        </nav>
    </header>

    <main>
    <h2>Cadastrar Novo Livro</h2>

    <!-- AQUI: Cole o Bloco de Busca Externa (Etapa 05) antes do formulário -->
    <div style="max-width: 600px; margin: 0 auto 1.5rem auto; display: flex; gap: 0.5rem;">
        <input type="text" id="busca-api" placeholder="Digite o nome de um livro (ex: Dom Casmurro)" style="flex: 1; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px;">
        <button type="button" id="btn-buscar-api" style="padding: 0.75rem 1.25rem; background-color: #17a2b8; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">
            Buscar na Web
        </button>
    </div>

    <!-- Div para as mensagens de erro/sucesso do formulário e da API -->
    <div id="mensagem-feedback" style="display: none; padding: 10px; margin-bottom: 15px; border-radius: 5px; text-align: center; font-weight: bold;"></div>

    <!-- O formulário original do seu site vem logo aqui abaixo -->
    <form id="form-cadastro">
        
        <label for="titulo">Título:</label>
        <input type="text" id="titulo" name="titulo" required>

        <label for="autor">Autor:</label>
        <input type="text" id="autor" name="autor" required>

        <label for="categoria">Categoria:</label>
        <input type="text" id="categoria" name="categoria" required>

        <label for="status">Status:</label>
        <select id="status" name="status" required>
            <option value="lido">Lido</option>
            <option value="lendo">Lendo</option>
            <option value="quero-ler">Quero Ler</option>
        </select>

        <label for="opiniao">Resenha / Opinião:</label>
        <textarea id="opiniao" name="opiniao" rows="3"></textarea>

        <button type="submit">Cadastrar Livro</button>
    </form>
</main>

    <footer>
        <p>&copy; 2026 BookWise - Todos os Direitos Reservados</p>
    </footer>

    <script type="module" src="js/main.js"></script>
</body>
</html>
